name: Publish TimeCS 3.1.0 Closed Wheels to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Verify Closed Wheel (Linux / py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout private repository into isolated folder
        uses: actions/checkout@v4
        with:
          repository: kushigaur3103-svg/time-code-security
          token: ${{ secrets.TCS_PRIVATE_PAT }}
          path: private_src
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel "cython>=3.0" pyyaml psutil tree-sitter tree-sitter-python auditwheel patchelf

      - name: Build closed-source Cython binary wheel
        working-directory: private_src
        run: |
          mkdir -p ../dist
          python scripts/build_closed_wheel.py --out-dir ../dist
          ls -1 ../dist

      - name: Repair Linux wheel to manylinux
        run: |
          set -euo pipefail
          rm -rf dist_repaired
          auditwheel repair dist/*.whl -w dist_repaired
          rm -f dist/*linux_x86_64.whl
          mv -f dist_repaired/*.whl dist
          ls -1 dist

      - name: Run Zero-Leak Gate on built wheel
        working-directory: private_src
        run: python scripts/verify_closed_wheel.py ../dist

      - name: Clean-venv compiled binary proof & 552/552 accuracy lock
        run: |
          python - << 'PYEOF'
          import os, pathlib, shutil, subprocess, sys, tempfile

          whls = sorted(pathlib.Path("dist").glob("*.whl"))
          assert len(whls) == 1, whls

          tmp = pathlib.Path(tempfile.gettempdir())
          venv = tmp / "tcs_clean_venv"
          subprocess.run([sys.executable, "-m", "venv", "--clear", str(venv)], check=True)
          vpy = str(venv / "bin" / "python")
          subprocess.run([vpy, "-m", "pip", "install", "--upgrade", "pip", "-q"], check=True)
          subprocess.run([vpy, "-m", "pip", "install", "-q", str(whls[0].resolve())], check=True)

          bench = tmp / "tcs_bench_stage"
          if bench.exists():
              shutil.rmtree(bench, ignore_errors=True)
          bench.mkdir()
          src = pathlib.Path("private_src")
          for folder in ("scripts", "benchmark"):
              shutil.copytree(src / folder, bench / folder, ignore=shutil.ignore_patterns("__pycache__"))
          if (src / "benchmark_manifest.json").exists():
              shutil.copy2(src / "benchmark_manifest.json", bench / "benchmark_manifest.json")

          code = (
              "import os, sys; sys.path.insert(0, os.getcwd()); "
              "import ast_scanner, cli, rule_engine, secret_scanner; "
              "assert ast_scanner.__file__.endswith('.so'), ast_scanner.__file__; "
              "from benchmark.runner import BenchmarkRunner; "
              "from benchmark.cross_runner import main as cross_main; "
              "rep = BenchmarkRunner(precision_threshold=1.0, recall_threshold=1.0).run_suite(); "
              "gm = rep.global_matrix; "
              "print(f'COMPILED_BENCH_552: total={rep.total_cases} tp={gm.tp} tn={gm.tn} fp={gm.fp} fn={gm.fn}'); "
              "assert rep.total_cases >= 552 and gm.tp == 276 and gm.tn == 276 and gm.fp == 0 and gm.fn == 0; "
              "assert cross_main([]) == 0; "
              "print('COMPILED_ACCURACY_LOCK_PASS')"
          )
          subprocess.run([vpy, "-c", code], cwd=str(bench), check=True)
          PYEOF

      - name: Upload verified wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  publish-pypi:
    name: Upload Verified 3.1.0 Wheels to PyPI
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified wheels
        uses: actions/download-artifact@v4
        with:
          pattern: verified-wheel-py*
          path: dist
          merge-multiple: true

      - name: Install twine and publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          ls -1 dist
          python -m pip install --upgrade pip twine -q
          twine upload --skip-existing dist/*.whl
